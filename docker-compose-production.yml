version: '3.8'

services:
  # Database
  postgres:
    image: postgres:15-alpine
    container_name: zelia-postgres
    environment:
      POSTGRES_DB: zelia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_2024}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - zelia-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: zelia-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_secure_2024}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - zelia-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: zelia-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secure_2024}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - zelia-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # n8n Workflow Engine
  n8n:
    image: n8nio/n8n:latest
    container_name: zelia-n8n
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-${N8N_BASIC_AUTH_PASSWORD:-change_me}}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=zelia
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-zelia}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-zelia_secure_2024}
      - N8N_PORT=5678
      - WEBHOOK_URL=http://localhost:5678/
      # - EXECUTIONS_MODE=queue
      # - QUEUE_BULL_REDIS_HOST=redis
      # - QUEUE_BULL_REDIS_PORT=6379
      # - QUEUE_BULL_REDIS_PASSWORD=${REDIS_PASSWORD:-redis_secure_2024}
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - zelia-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Entity Extraction Service (Gemini Optimized)
  entity-extraction:
    build:
      context: ./services/entity-extraction
      dockerfile: Dockerfile
    container_name: zelia-entity-extraction
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - SERVICE_PORT=8011
      - LLM_PROVIDER=groq
    ports:
      - "8011:8011"
    networks:
      zelia-network:
        aliases:
          - intent-detector
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8011/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Embedding Service (Semantic Mapping)
  embedding-service:
    build:
      context: ./services/embedding-service
      dockerfile: Dockerfile
    container_name: zelia-embedding
    environment:
      - SERVICE_PORT=8001
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    ports:
      - "8001:8001"
    networks:
      - zelia-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8001/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Rules Engine
  rules-engine:
    build:
      context: ./services/rules-engine
      dockerfile: Dockerfile
    container_name: zelia-rules-engine
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-zelia}:${POSTGRES_PASSWORD:-zelia_secure_2024}@postgres:5432/zelia
      - SERVICE_PORT=8005
    ports:
      - "8005:8005"
    networks:
      - zelia-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8005/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Retrieval Service (Annoy + Embeddings)
  retrieval-service:
    build:
      context: ./services/retrieval-service
      dockerfile: Dockerfile
    container_name: zelia-retrieval
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-zelia}:${POSTGRES_PASSWORD:-zelia_secure_2024}@postgres:5432/zelia
      - MODEL_NAME=sentence-transformers/all-MiniLM-L6-v2
      - SERVICE_PORT=8007
    ports:
      - "8007:8007"
    volumes:
      - annoy_index:/app/index
    networks:
      - zelia-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8007/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Pinecone Service
  pinecone-service:
    build:
      context: ./services/pinecone-service
      dockerfile: Dockerfile
    container_name: zelia-pinecone
    environment:
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - INDEX_NAME=${PINECONE_INDEX_NAME}
      - SERVICE_PORT=8014
    ports:
      - "8014:8014"
    networks:
      - zelia-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8009/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # OCR Service
  ocr-service:
    build:
      context: ./services/ocr-service
      dockerfile: Dockerfile
    container_name: zelia-ocr
    environment:
      - SERVICE_PORT=8003
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin_secure_2024}
    ports:
      - "8003:8003"
    networks:
      - zelia-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8003/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # LayoutLM Worker
  layout-worker:
    build:
      context: ./services/layout-worker
      dockerfile: Dockerfile
    container_name: zelia-layoutlm
    environment:
      - SERVICE_PORT=8006
      - MODEL_NAME=nielsr/layoutlm-finetuned-funsd
    ports:
      - "8006:8006"
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    networks:
      - zelia-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8006/health" ]
      interval: 60s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  # Form Filler Service
  form-filler:
    build:
      context: ./services/form-filler
      dockerfile: Dockerfile
    container_name: zelia-form-filler
    environment:
      - SERVICE_PORT=8013
    ports:
      - "8013:8013"
    volumes:
      - ./templates:/app/templates:ro
      - filled_forms:/app/output
    networks:
      zelia-network:
        aliases:
          - form-filler-service
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8013/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Response Generator
  response-generator:
    build:
      context: ./services/response-generator
      dockerfile: Dockerfile
    container_name: zelia-response-generator
    environment:
      - SERVICE_PORT=8015
      - SARVAM_API_KEY=${SARVAM_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - LLM_PROVIDER=gemini
    ports:
      - "8015:8015"
    networks:
      - zelia-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8015/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: zelia-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - zelia-network
    restart: unless-stopped

  # Grafana Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: zelia-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3000:3000"
    networks:
      - zelia-network
    depends_on:
      - prometheus
    restart: unless-stopped

  # ELK Stack - Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: zelia-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - zelia-network
    restart: unless-stopped

  # ELK Stack - Logstash
  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    container_name: zelia-logstash
    volumes:
      - ./monitoring/logstash/pipeline:/usr/share/logstash/pipeline:ro
    ports:
      - "5001:5000/tcp"
      - "5001:5000/udp"
      - "9600:9600"
    networks:
      - zelia-network
    depends_on:
      - elasticsearch
    restart: unless-stopped

  # ELK Stack - Kibana
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: zelia-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - zelia-network
    depends_on:
      - elasticsearch
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  redis_data:
  n8n_data:
  annoy_index:
  filled_forms:
  prometheus_data:
  grafana_data:
  elasticsearch_data:


networks:
  zelia-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
